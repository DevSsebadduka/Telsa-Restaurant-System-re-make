<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telsa Login</title>
    <link rel="stylesheet" href="menu_login.css">
</head>
<body>
    <div class="content">    
        <div class="header">
            <div class="top">
                <h2>TELSA RESTAURANT</h2>
                <p class="goal">Quality is our Assurance</p>
                <p class="welcome">Welcome Staff Member</p>
            </div>
        </div>

        <form action="index.html" method="get">
            <div class="login-box">
                <h1>SIGN IN</h1>
                <div class="Email">
                    <input type="text" id="email" placeholder="Username" required>
                </div>
                <div class="Passward">
                    <input type="password" id="passward" placeholder="Passward" maxlenght="10" minlength="5" required>
                </div>
                <input type="button" value="Login" class="login">
            </div>
        </form>
    </div>

    <script src="menu_login.js"></script>
</body>
</html>
